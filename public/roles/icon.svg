<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="icon-title icon-desc">
<title id="icon-title">Moonlit Werewolf</title>
<desc id="icon-desc">A bold dark wolf howls upward against a large amber moon and a full-bleed midnight sky.</desc>
<defs>
<linearGradient id="icon-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f1220"/><stop offset="1" stop-color="#1f2550"/></linearGradient>
<radialGradient id="icon-halo"><stop stop-color="#c9a16c" stop-opacity=".24"/><stop offset="1" stop-color="#c9a16c" stop-opacity="0"/></radialGradient>
<linearGradient id="icon-moon" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fae8b4"/><stop offset="1" stop-color="#c9a477"/></linearGradient>
<linearGradient id="icon-wolf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111929"/><stop offset="1" stop-color="#080e1b"/></linearGradient>
</defs>
