<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-labelledby="guard-title guard-desc">
<title id="guard-title">guard</title>
<desc id="guard-desc">Hand-crafted moonlit party game character card.</desc>
