<path d="m88 57 12-4-4 12-12 4ZM50 112l4-11 5 11-5 11Z" fill="#d4b779" stroke="none"/>
<path d="M113 53h15m-8-7v14M42 149h15m-8-7v14"/>
</g>
<g id="card-back-ray" stroke="url(#card-back-gold)" fill="none">
<path d="M200 113v30m0-47v7" stroke-width="1.5"/>
<path d="m200 147 4 8-4 9-4-9Z" fill="#c7aa6f"/>
</g>
</defs>
