<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-labelledby="card-back-title card-back-desc">
<title id="card-back-title">Moonwatch card back</title>
<desc id="card-back-desc">A luminous crescent cradles an all-seeing eye within a symmetrical navy and gold celestial filigree.</desc>
<defs>
<linearGradient id="card-back-bg" x2=".8" y2="1"><stop stop-color="#171e36"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
<radialGradient id="card-back-glow"><stop stop-color="#394970" stop-opacity=".8"/><stop offset="1" stop-color="#11182b" stop-opacity="0"/></radialGradient>
<linearGradient id="card-back-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8a7044"/><stop offset=".35" stop-color="#f1d799"/><stop offset=".65" stop-color="#ba9457"/><stop offset="1" stop-color="#ecd49c"/></linearGradient>
<radialGradient id="card-back-iris"><stop stop-color="#dddfb6"/><stop offset=".5" stop-color="#839f9f"/><stop offset="1" stop-color="#344e68"/></radialGradient>
<g id="card-back-corner" fill="none" stroke="url(#card-back-gold)" stroke-linecap="round" stroke-linejoin="round">
<path d="M37 122V52q0-15 15-15h65" stroke-width="2"/>
<path d="M47 111V57q0-10 10-10h46" stroke-opacity=".6"/>
<path d="M45 134c30-9 39-40 24-54-12-12-24 0-18 12 6 11 26 5 31-7 8-20-9-35-26-28" stroke-width="1.5"/>
